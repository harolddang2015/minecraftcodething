<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Realtime Workspace</title>

<style>
body {
  margin: 0;
  font-family: system-ui;
  background: #0b0b0e;
  color: white;
}

/* login */
.overlay {
  position: fixed;
  inset: 0;
  background: #0b0b0e;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  background: #141419;
  padding: 25px;
  border-radius: 12px;
  width: 300px;
}

input, button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
}

.workspace {
  padding: 30px;
}

/* Canva-style cursor */
.cursor {
  position: fixed;
  width: 14px;
  height: 14px;
  background: #6366f1;
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
}

.cursor-tag {
  position: absolute;
  top: -26px;
  left: 10px;
  background: #6366f1;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 11px;
  white-space: nowrap;
}

.credit {
  position: fixed;
  bottom: 10px;
  right: 10px;
  font-size: 11px;
  opacity: 0.6;
}
</style>
</head>

<body>

<div id="login" class="overlay">
  <div class="card">
    <h3>Enter Workspace</h3>
    <input id="username" placeholder="Username">
    <button id="join">Join</button>
  </div>
</div>

<div class="workspace">
  <input id="box1" placeholder="Textbox 1">
  <input id="box2" placeholder="Textbox 2">
</div>

<div id="cursors"></div>

<div class="credit">Realtime Workspace • Cursor Sync</div>

<script src="app.js"></script>
</body>
</html>
